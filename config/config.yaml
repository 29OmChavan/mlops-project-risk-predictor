artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  kaggle_dataset: mirichoi0218/insurance
  source_url: https://raw.githubusercontent.com/stedy/Machine-Learning-with-R-datasets/master/insurance.csv
  raw_data_file: artifacts/data_ingestion/insurance_raw.csv
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv
  test_size: 0.2
  random_state: 42

data_validation:
  root_dir: artifacts/data_validation
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv
  status_file: artifacts/data_validation/status.txt
  drift_report_file: artifacts/data_validation/drift_report.yaml
  eda_summary_file: artifacts/data_validation/eda_summary.json

data_transformation:
  root_dir: artifacts/data_transformation
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv
  preprocessor_path: artifacts/data_transformation/preprocessor.pkl
  transformed_train_path: artifacts/data_transformation/train_arr.npy
  transformed_test_path: artifacts/data_transformation/test_arr.npy

model_trainer:
  root_dir: artifacts/model_trainer
  transformed_train_path: artifacts/data_transformation/train_arr.npy
  transformed_test_path: artifacts/data_transformation/test_arr.npy
  trained_model_path: artifacts/model_trainer/model.pkl
  training_report_path: artifacts/model_trainer/model_comparison.json
  expected_r2_threshold: 0.75

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_ingestion/test.csv
  transformed_test_path: artifacts/data_transformation/test_arr.npy
  model_path: artifacts/model_trainer/model.pkl
  preprocessor_path: artifacts/data_transformation/preprocessor.pkl
  metric_file_name: artifacts/model_evaluation/metrics.json
  mlflow_uri: https://dagshub.com/29omchavan/mlops-project-1-risk-predictor.mlflow
  experiment_name: insurance-risk-predictor-v1
  registered_model_name: InsuranceRiskPredictorModel
